name: Android native build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "android/**"
      - "recomp/output/**"
      - ".github/workflows/android-build.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: manhunt2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM32 and ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout private project
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-37" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK for both ARM ABIs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhunt2-Android-ARM32-ARM64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
